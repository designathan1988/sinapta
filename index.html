<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#191919"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Pagecraft</title>
  </head>
  <body>
    <div data-app-root></div>
    <div class="visually-hidden" role="status" data-announcer></div>
    <!-- Repeats the name of the control it is shown for, so it is hidden from
         assistive technology. -->
    <div class="tooltip" id="tooltip" popover="hint" aria-hidden="true"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
